<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personalização de Fundo</title>
    <style>
        body {
            background-image: url('images/pattern002.png');
            background-size: 300px 300px;
            background-repeat: no-repeat;
        
        }
        /* Comentário: O background sempre vai ser usado em modo repeat, quando nao é usado o cover (cobre todo o background), tambem pode ser usado o repeat-x ou repeat-y (que usam os eixos x e y das aulas de matematica. Tambem da pra ser usado o no-repeat que aparece apenas uma imagem), Testando nao da pra usar o x e y concomitantemente */ 
        h1 { 
            color: rgb(255, 0, 0);
        }
    </style>
</head>
<body>
    <h1>Teste de Personalização de Fundo</h1>
</body>
</html>
