<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de imagem</title>
    <style>
        body {
            background-image: url('images/wallpaper001.jpg');
        }
        div.quadrado {
            display: inline-block;
            border: 2px solid black;
            border-radius: 10px;
            background-color: lightgray;
            width: 200px;
            height: 200px;
        }
        div#q1 {
            background-color: rgb(161, 242, 161)
        }
        div#q2 {
            background-image: linear-gradient(to right, red, yellow) ;
        }
        div#q3 {
            background-image: url('images/pattern003.png')
        }
        div#q4 {
            background-image: linear-gradient(to bottom, blue, cyan) ;
        }
        div#q5 {
            background-image: url('images/pattern001.png')
        }
        
    </style>
</head>
<body>
    <div class="quadrado" id="q1">

    </div>
    <div class="quadrado" id="q2">

    </div>
    <div class="quadrado" id="q3">
    
    </div>
     <div class="quadrado" id="q4">
    
    </div>
     <div class="quadrado" id="q5">
    
    </div>

</body>
</html>
